      ]
    },
    {
      tag:'第三关', name:'AI 换脸借钱', theme:'防骗工具包',
      other:{ ico:'📹', nm:'"班主任"', },
      who:'"班主任"', whoBad:false,
      bubble:'晚上，小明接到"班主任"的视频电话——画面和声音都是班主任本人，说学校临时收资料费，让小明用父母手机转 <span class="hl">800 元</span>到指定账户，很急。',
      options:[
        { text:'班主任本人视频，肯定是真的，赶紧转账', correct:false },
        { text:'挂断，回拨班主任真实号码核实，或问家长', correct:true }
      ],
      reactOk:'🎉 <b>漂亮！</b>AI 换脸能伪造人脸和声音，视频里"眼见"也未必为实。',
      reactBad:'😰 <b>上当了！</b>这是 AI 换脸诈骗——骗子能伪造班主任的脸和声音。',
      teach:[
        { ico:'🤖', hot:false, title:'AI 换脸是啥', text:'骗子用<b>几张照片、几秒语音</b>，就能合成"班主任"的脸和声音。视频里"眼见为实"已经不灵了。' },
        { ico:'🔁', hot:false, title:'破解一招', text:'<b>挂断 → 回拨本人真实号码（或当面、问家长）核实。</b>真的班主任不会拒绝你核实。' },
        { ico:'📞', hot:false, title:'记住 96110', text:'<b>96110</b> 是国家反诈中心专线。拿不准就打 96110，或拨 110 报警。' },
        { ico:'🛡️', hot:false, title:'三不一多', text:'<b>不轻信、不透露、不转账，多核实。</b>记住这七个字，就是你的"武器包"。' }
      ]
    }
  ];

  /* ================= 音效 ================= */
  var audioCtx=null;
  function initAudio(){ try{ if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();} if(audioCtx.state==='suspended'){audioCtx.resume();} }catch(e){} }
  function beep(f,d,t,v){ if(!audioCtx)return; try{ var o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t||'sine'; o.frequency.value=f; g.gain.value=v||0.16; o.connect(g); g.connect(audioCtx.destination); var t0=audioCtx.currentTime; o.start(t0); g.gain.setValueAtTime(v||0.16,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+d); o.stop(t0+d);}catch(e){} }
  function sOK(){ beep(660,.12); setTimeout(function(){beep(880,.18);},90); }
  function sBAD(){ beep(220,.3,'sawtooth',.12); }
  function sPop(){ beep(540,.08,'triangle',.12); }
  function sWin(){ beep(523,.18); setTimeout(function(){beep(659,.18);},160); setTimeout(function(){beep(784,.32);},320); }

  /* ================= 状态 ================= */
  var state={ screen:'intro', level:0, phase:'scene', picked:null, results:[], taught:0 };

  function $(id){ return document.getElementById(id); }
  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstChild; }

  function render(){
    var app=$('app');
    if(state.screen==='intro') app.innerHTML=introHTML();
    else if(state.screen==='level') app.innerHTML=levelHTML();
    else if(state.screen==='result') app.innerHTML=resultHTML();
  }

  function topbarHTML(){
    var s='<div class="topbar">';
    for(var i=0;i<3;i++){
      var cls='step';
      if(i<state.level) cls+=' done'; else if(i===state.level) cls+=' active';
      var mark=i<state.level?'✓':(i+1);
      s+='<div class="'+cls+'"><div class="dot">'+mark+'</div><div class="lbl">'+LEVELS[i].name+'</div></div>';
      if(i<2) s+='<div class="arrow">→</div>';
    }
    return s+'</div>';
  }

  /* ============ 开场页 ============ */
  function introHTML(){
    var lv='';
    var icos=['🎮','💰','📹'], ds=['进群领皮肤？','出租号赚钱？','班主任借钱？'];
    LEVELS.forEach(function(L,i){
      lv+='<div class="lv-card"><div class="ico">'+icos[i]+'</div><div class="nm">'+L.name+'</div><div class="ds">'+ds[i]+'</div></div>';
    });
    return '<div class="stage"><div class="intro-wrap">'+
      '<div class="intro-badge">全班闯关 · 情景判断</div>'+
      '<div class="intro-hero">'+xiaoming('normal')+'<h1 class="intro-title">小明的一个<br><span class="accent">普通下午</span></h1></div>'+
      '<div class="intro-sub">三个岔路口，你替小明选——选完看后果，闯完学知识</div>'+
      '<div class="lv-list">'+lv+'</div>'+
      '<div class="intro-sub" style="color:#94A3B8;font-size:clamp(13px,2vh,18px);">玩法：全班讨论 → 代表(或全班举手)选 → 看动画 → 进讲解</div>'+
      '<button class="btn-start" onclick="startGame()">开始闯关</button>'+
      '</div></div>';
  }

  /* ============ 关卡页 ============ */
  function levelHTML(){
    var L=LEVELS[state.level];

    if(state.phase==='scene'){
      return topbarHTML()+ scenePhaseHTML(L);
    } else {
      return topbarHTML()+ teachPhaseHTML(L);
    }
  }

  function scenePhaseHTML(L){
    var mood='normal';
    if(state.picked!==null){ mood=L.options[state.picked].correct?'happy':'sad'; }
    var mingHtml=xiaoming(mood);

    var opts='';
    L.options.forEach(function(o,i){
      var cls='opt';
      if(state.picked!==null){ cls+=' disabled'; if(o.correct) cls+=' picked-ok'; else if(state.picked===i) cls+=' picked-bad'; else cls+=' dim'; }
      opts+='<div class="'+cls+'" onclick="pick('+i+')"><div class="tag">'+(i===0?'A':'B')+'</div><div>'+o.text+'</div></div>';
    });

    var bubble='';
    if(state.picked===null){
      bubble='<div class="bubble'+(L.whoBad?' bad':'')+'"><span class="who">'+L.who+'</span><br>'+L.bubble+'</div>';
    } else {
      var ok=L.options[state.picked].correct;
      var cls=ok?'result-ok':'result-bad';
      bubble='<div class="bubble '+cls+'">'+(ok?L.reactOk:L.reactBad)+'</div>';
    }

    var foot='';
    if(state.picked!==null){
      foot='<div class="foot"><button class="btn-next" onclick="goTeach()">看讲解 →</button></div>';
    }

    return '<div class="stage">'+
      '<div class="scene-wrap">'+
        '<div class="actor"><div class="avatar other" style="'+(state.picked===null?'':'animation:none;')+'">'+L.other.ico+'</div><div class="name">'+L.other.nm+'</div></div>'+
        bubble+
        '<div class="actor">'+mingHtml+'<div class="name">小明</div></div>'+
      '</div>'+
      '<div class="options">'+opts+'</div>'+
      foot+
      '</div>';
  }

  /* ============ 讲解页 ============ */
  function teachPhaseHTML(L){
    var shown=L.teach.slice(0, state.taught);
    var cards='';
    shown.forEach(function(t){
      cards+='<div class="card'+(t.hot?' hot':'')+'"><div class="c-ico">'+t.ico+'</div><div class="c-body"><div class="c-title">'+t.title+'</div><div class="c-text">'+t.text+'</div></div></div>';
    });

    var hint='';
    var foot='';
    if(state.taught < L.teach.length){
      hint='<div class="teach-hint" onclick="nextCard()">👆 点击屏幕，揭晓下一条知识点</div>';
    } else {
      var nextLabel= state.level===2 ? '查看战果' : '下一关 →';
      foot='<div class="foot"><button class="btn-next" onclick="nextLevel()">'+nextLabel+'</button></div>';
    }

    var mingMood = state.results[state.level] ? 'happy' : 'sad';

    return '<div class="stage"><div class="teach-wrap">'+
      '<div class="teach-head">'+xiaoming(mingMood)+
        '<div class="tt"><div class="teach-tag">'+L.tag+' 通关 · '+L.theme+'</div><div class="teach-title">这一关，你学到了什么？</div><div class="teach-sub">老师每讲一条，点一下屏幕揭晓——和'+L.name+'案例一一对应</div></div>'+
      '</div>'+
      '<div class="teach-stage" id="teachStage">'+cards+hint+'</div>'+
      '<div class="teach-progress">已揭晓 '+state.taught+' / '+L.teach.length+' 条</div>'+
      foot+
      '</div></div>';
  }

  /* ============ 结算页 ============ */
  function resultHTML(){
    var allOk=state.results.every(function(r){return r;});
    var cards='';
    var reminds=['天上不会掉皮肤','别给骗子递刀','涉钱必核实'];
    LEVELS.forEach(function(L,i){
      var ok=state.results[i];
      cards+='<div class="r-card '+(ok?'ok':'bad')+'"><div class="rn">'+L.name+'</div><div class="rs">'+(ok?'✓ 躲过了':'✗ 踩坑了')+'</div><div class="remind">'+reminds[i]+'</div></div>';
    });
    var title= allOk ? '三关全过，完美！' : '闯关完成，坑都记住了！';
    var emoji= allOk ? '🏆' : '💪';
    return '<div class="stage"><div class="result-wrap">'+
      '<div class="result-emoji">'+emoji+'</div>'+
      '<div class="result-badge">'+(allOk?'金牌通关':'闯关完成')+'</div>'+
      '<h1 class="result-title">'+title+'</h1>'+
      '<div class="intro-sub">记住这些坑，你就是自己的"网络安全官"——现在去 PPT 里领取"反诈武器包"</div>'+
      '<div class="result-grid">'+cards+'</div>'+
      '<button class="btn-restart" onclick="restart()">再来一次</button>'+
      '</div></div>';
  }

  /* ============ 交互 ============ */
  window.startGame=function(){
    initAudio();
    state.screen='level'; state.level=0; state.phase='scene'; state.picked=null; state.results=[]; state.taught=0;
    render();
  };
  window.pick=function(i){
    if(state.picked!==null) return;
    state.picked=i;
    var ok=LEVELS[state.level].options[i].correct;
    state.results[state.level]=ok;
    if(ok) sOK(); else sBAD();
    render();
    // 滚动到反馈气泡
    var stage=$('app');
    if(stage) stage.scrollTop=0;
  };
  window.goTeach=function(){
    state.phase='teach'; state.taught=0;
    sPop();
    render();
  };
  window.nextCard=function(){
    var L=LEVELS[state.level];
    if(state.taught < L.teach.length){
      state.taught++;
      sPop();
      render();
      // 滚动到底部
      setTimeout(function(){ var s=$('teachStage'); if(s){ s.scrollTop=s.scrollHeight; } },60);
    }
  };
  window.nextLevel=function(){
    if(state.level<2){ state.level++; state.phase='scene'; state.picked=null; state.taught=0; render(); }
    else { state.screen='result'; sWin(); render(); }
  };
  window.restart=function(){
    state.screen='intro'; state.level=0; state.phase='scene'; state.picked=null; state.results=[]; state.taught=0;
    render();
  };

  render();
})();
</script>
</body>
</html>
