<style>
  :root{
    --blue:#2563EB; --blue-deep:#1D4ED8; --blue-bg:#EFF6FF; --blue-line:#BFDBFE;
    --red:#EF4444; --red-deep:#DC2626; --red-bg:#FEF2F2; --red-line:#FECACA;
    --ink:#0F172A; --sub:#64748B; --line:#E2E8F0;
    --ok:#16A34A; --ok-bg:#DCFCE7; --bad:#DC2626; --bad-bg:#FEE2E2;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{width:100%; height:100%; overflow:hidden;}
  body{

    background:#FFFFFF; color:var(--ink);
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  .hidden{display:none !important;}
  .screen{position:absolute; inset:0;}

  /* ============ 开始页 ============ */
  #setup{display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#EFF6FF 0%,#FFFFFF 55%,#F0F9FF 100%); gap:2.2vh; padding:4vh 6vw;}
  .setup-title{font-size:clamp(40px,7vh,76px); font-weight:800; letter-spacing:4px; color:var(--ink); text-align:center;}
  .setup-title .accent{background:linear-gradient(135deg,var(--blue),#3B82F6); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .setup-sub{font-size:clamp(16px,2.6vh,26px); color:var(--sub); letter-spacing:6px;}
  .setup-card{background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 10px 40px rgba(37,99,235,.08);
    padding:3vh 3.5vw; display:flex; flex-direction:column; gap:2.2vh; width:min(720px,90vw);}
  .setup-row{display:flex; align-items:center; gap:14px;}
  .setup-label{font-size:clamp(15px,2.2vh,20px); color:var(--sub); white-space:nowrap; font-weight:600;}
  .team-input{flex:1; height:5.5vh; min-height:44px; border:2px solid var(--line); border-radius:12px;
    font-size:clamp(16px,2.4vh,22px); padding:0 14px; color:var(--ink); outline:none; font-family:inherit;}
  .team-input:focus{border-color:var(--blue);}
  .team-input.red:focus{border-color:var(--red);}
  .seg{display:flex; gap:10px; flex-wrap:wrap;}
  .seg-btn{flex:1; min-width:90px; height:5.2vh; min-height:44px; border:2px solid var(--line); border-radius:12px;
    background:#fff; font-size:clamp(15px,2.2vh,20px); color:var(--sub); font-weight:600; cursor:pointer; font-family:inherit;}
  .seg-btn.active{border-color:var(--blue); background:var(--blue-bg); color:var(--blue-deep); font-weight:700;}
  .setup-rules{background:#F8FAFC; border-radius:14px; padding:14px 18px; font-size:clamp(13px,2vh,18px); color:var(--sub); line-height:1.7;}
  .setup-rules b{color:var(--ink);}
  .start-btn{height:7vh; min-height:52px; border:none; border-radius:16px; cursor:pointer;
    background:linear-gradient(135deg,var(--blue),#3B82F6); color:#fff; font-size:clamp(20px,3.2vh,30px); font-weight:800; letter-spacing:3px;
    box-shadow:0 8px 24px rgba(37,99,235,.35); font-family:inherit;}
  .start-btn:active{transform:scale(.98);}

  /* ============ 游戏页 ============ */
  #game{display:flex; flex-direction:column; background:#F1F5F9;}
  .topbar{height:12vh; min-height:88px; background:#fff; border-bottom:2px solid var(--line);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 2vw; gap:2vw;}
  .side-info{display:flex; flex-direction:column; gap:8px; min-width:0;}
  .side-info.right{align-items:flex-end;}
  .side-head{display:flex; align-items:center; gap:10px;}
  .side-head.right{flex-direction:row-reverse;}
  .team-badge{font-size:clamp(15px,2.2vh,20px); font-weight:800; padding:2px 14px; border-radius:999px; color:#fff; white-space:nowrap;}

  .team-badge.red{background:var(--red);}
  .score-num{font-size:clamp(22px,3.4vh,36px); font-weight:800;}

  .score-num.red{color:var(--red);}
  .score-detail{font-size:clamp(12px,1.8vh,17px); color:var(--sub);}
  .progress-wrap{width:100%; height:16px; background:#EEF2F7; border-radius:999px; overflow:hidden;}
  .progress-bar{height:100%; width:0%; border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1);}

  .half.right{background:var(--red-bg); border-left:3px solid var(--red-line);}

  .half.left .opt .tag{background:var(--blue-bg); color:var(--blue-deep);}
  .half.right .opt .tag{background:var(--red-bg); color:var(--red-deep);}
  .opt.correct{border-color:var(--ok); background:var(--ok-bg);}
  .opt.correct .tag{background:var(--ok); color:#fff;}
  .opt.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .opt.wrong .tag{background:var(--bad); color:#fff;}
  .opt.reveal-correct{border-color:var(--ok); background:var(--ok-bg);}
  .opt.reveal-correct .tag{background:var(--ok); color:#fff;}

  .feedback.bad{background:var(--bad-bg); color:#B91C1C; border:2px solid #FECACA;}
  .feedback.skip{background:#EEF2F7; color:var(--sub); border:2px solid var(--line);}

  .done-hint{flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2vh;}

  .result-card .r-name{font-size:clamp(20px,3vh,30px); font-weight:800;}

  .result-card .r-name.red{color:var(--red);}
  .result-card .r-score{font-size:clamp(50px,8vh,84px); font-weight:900; line-height:1;}
  .result-card .r-score.blue{color:var(--blue);}
  .result-card .r-score.red{color:var(--red);}
  .result-card .r-stat{font-size:clamp(14px,2vh,20px); color:var(--sub);}
  .crown{font-size:clamp(30px,5vh,52px);}
  .result-actions{display:flex; gap:2vw; margin-top:1vh;}
  .btn2{border:none; border-radius:14px; cursor:pointer; font-family:inherit; font-weight:700;
    padding:1.8vh 3vw; font-size:clamp(16px,2.4vh,24px); letter-spacing:2px;}
  .btn2.primary{background:linear-gradient(135deg,var(--blue),#3B82F6); color:#fff; box-shadow:0 6px 18px rgba(37,99,235,.3);}
  .btn2.ghost{background:#fff; color:var(--sub); border:2px solid var(--line);}
  .btn2:active{transform:scale(.97);}
  .fair-note{font-size:clamp(12px,1.8vh,17px); color:#94A3B8;}
</style>

    {type:'choice', q:'国家反诈中心的全国统一预警劝阻咨询电话是？',
      options:['96110','12345','10086','114'],
      answer:0, explain:'96110 是反诈专线，接到这个电话说明你可能正遭遇诈骗，务必接听。'},
    {type:'choice', q:'以下哪个是"钓鱼网站"的典型特征？',

      answer:0, explain:'钓鱼网站靠"仿冒域名"迷惑人，比如把字母 l 换成数字 1，要多看几眼网址。'},

      options:['可以告诉客服','是账户的最后一道防线，不能泄露给任何人','发给同学没关系','别人要就给'],

      answer:false, explain:'AI 换脸、AI 拟声可以伪造音视频，眼见耳听未必为实，涉及钱财要二次核实。'},
    {type:'judge', q:'把闲置的银行卡、电话卡借给"朋友"赚点零花钱，没什么大不了。',
      answer:false, explain:'出租、出借两卡可能涉嫌帮信罪，是违法犯罪行为。'},
    {type:'judge', q:'密码越长越复杂越安全，不同账号最好用不同密码。',
      answer:true, explain:'复杂且独立的密码能大大降低被破解、被"撞库"的风险。'},
    {type:'judge', q:'被骗后保留聊天记录、转账凭证，并第一时间拨打 96110 或 110，是正确的。',
      answer:true, explain:'及时报警和保存证据，是追回损失、打击犯罪的关键。'},
    {type:'judge', q:'在公共场所连免费 WiFi 时，进行网上支付和登录银行是安全的。',
      answer:false, explain:'公共 WiFi 可能被监听或伪造，涉及资金操作尽量用移动数据或回到安全网络。'},
    {type:'judge', q:'网络空间不是法外之地，网暴他人、造谣传谣都要承担法律责任。',
      answer:true, explain:'网络行为同样受法律约束，网暴、造谣可能承担民事甚至刑事责任。'},
    {type:'judge', q:'未成年人也可能成为网络诈骗、盗号等犯罪的目标。',
      answer:true, explain:'未成年人的账号、个人信息同样会被盯上，比如游戏交易、冒充好友诈骗等。'},
    {type:'judge', q:'收到"中奖"短信，要求先交"手续费"才能领奖，这是正规流程。',
      answer:false, explain:'"先交钱后领奖"是典型诈骗套路，正规中奖不会让你先掏钱。'},
  ];

  /* ================= 工具 ================= */
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  // 生成两份顺序不同的索引
  function twoOrders(){
    var o1 = shuffle(BANK.map(function(_,i){return i;}));
    var o2 = shuffle(BANK.map(function(_,i){return i;}));
    var same = o1.length===o2.length && o1.every(function(v,i){return v===o2[i];});
    if(same){ // 几乎不可能，保险起见再洗一次
      o2 = shuffle(BANK.map(function(_,i){return i;}));
    }
    return [o1, o2];
  }
  function fmtTime(s){
    var m = Math.floor(s/60), sec = s%60;
    return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
  }

  /* ================= 音效（Web Audio，无外部文件） ================= */
  var audioCtx = null;
  function initAudio(){
    try{
      if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
      if(audioCtx.state==='suspended'){ audioCtx.resume(); }
    }catch(e){}
  }
  function beep(freq, dur, type, vol){
    if(!audioCtx) return;
    try{
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type = type||'sine'; o.frequency.value=freq;
      g.gain.value = vol||0.18;
      o.connect(g); g.connect(audioCtx.destination);
      var t0=audioCtx.currentTime;
      o.start(t0);
      g.gain.setValueAtTime(vol||0.18, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      o.stop(t0+dur);
    }catch(e){}
  }
  function sCorrect(){ beep(660,0.12); setTimeout(function(){beep(880,0.18);},90); }
  function sWrong(){ beep(200,0.28,'sawtooth',0.14); }
  function sSkip(){ beep(440,0.08,'triangle',0.1); }
  function sTick(){ beep(1000,0.06,'square',0.07); }
  function sEnd(){ beep(523,0.18); setTimeout(function(){beep(659,0.18);},160); setTimeout(function(){beep(784,0.32);},320); }

  /* ================= 状态 ================= */
  var totalTime = 180;
  var remain = 180;
  var timerId = null;
  var playing = false;
  var players = {
    L:{ name:'蓝队', order:[], idx:0, correct:0, wrong:0, skip:0, score:0, done:false, locked:false },
    R:{ name:'红队', order:[], idx:0, correct:0, wrong:0, skip:0, score:0, done:false, locked:false }
  };

  /* ================= DOM ================= */
  var $=function(id){return document.getElementById(id);};
  var elSetup=$('setup'), elGame=$('game'), elResult=$('result');
  var halfL=$('halfL'), halfR=$('halfR');

  /* ================= 开始页交互 ================= */
  var segBtns = Array.prototype.slice.call(document.querySelectorAll('.seg-btn'));
  segBtns.forEach(function(b){
    b.addEventListener('click', function(){
      segBtns.forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      totalTime = parseInt(b.getAttribute('data-t'),10);
    });
  });

  function startGame(){
    initAudio();
    var nl = $('nameL').value.trim() || '蓝队';
    var nr = $('nameR').value.trim() || '红队';
    players.L.name = nl; players.R.name = nr;
    players.L.correct=players.L.wrong=players.L.skip=players.L.score=0; players.L.done=players.L.locked=false;
    players.R.correct=players.R.wrong=players.R.skip=players.R.score=0; players.R.done=players.R.locked=false;
    var orders = twoOrders();
    players.L.order = orders[0]; players.L.idx = 0;
    players.R.order = orders[1]; players.R.idx = 0;

    // 更新顶部
    $('badgeL').textContent = nl; $('badgeR').textContent = nr;
    updateTop();

    elSetup.classList.add('hidden');
    elResult.classList.add('hidden');
    elGame.classList.remove('hidden');

    // 3-2-1 准备
    playing = false;
    halfL.innerHTML = '<div class="done-hint"><div class="big" style="font-size:clamp(40px,9vh,100px);color:var(--blue)">准备</div></div>';
    halfR.innerHTML = '<div class="done-hint"><div class="big" style="font-size:clamp(40px,9vh,100px);color:var(--red)">准备</div></div>';
    var count = 3;
    var readyId = setInterval(function(){
      if(count>0){
        halfL.querySelector('.big').textContent = count;
        halfR.querySelector('.big').textContent = count;
        beep(700,0.12,'square',0.1);
        count--;
      }else{
        clearInterval(readyId);
        halfL.querySelector('.big').textContent = 'GO!';
        halfR.querySelector('.big').textContent = 'GO!';
        beep(1100,0.3,'square',0.12);
        setTimeout(function(){ beginPlay(); }, 600);
      }
    }, 700);
  }

  function beginPlay(){
    playing = true;
    remain = totalTime;
    updateTimer();
    renderQuestion('L');
    renderQuestion('R');
    timerId = setInterval(function(){
      remain--;
      updateTimer();
      if(remain<=5 && remain>0){ sTick(); }
      if(remain<=0){
        remain=0; updateTimer();
        finish();
      }
    }, 1000);
  }

  function updateTimer(){
    $('timerNum').textContent = fmtTime(remain);
    if(remain<=10){
      $('timerBox').classList.add('warning');
    }else{
      $('timerBox').classList.remove('warning');
    }
  }

  function updateTop(){
    var L=players.L, R=players.R;
    $('scoreL').textContent = L.score;
    $('scoreR').textContent = R.score;
    $('detailL').textContent = '答对 '+L.correct+' · 答错 '+L.wrong + (L.skip?' · 跳过 '+L.skip:'');
    $('detailR').textContent = '答对 '+R.correct+' · 答错 '+R.wrong + (R.skip?' · 跳过 '+R.skip:'');
    $('barL').style.width = Math.min(L.score,100)+'%';
    $('barR').style.width = Math.min(R.score,100)+'%';
  }

  /* ================= 渲染题目 ================= */
  function renderQuestion(side){
    var p = players[side];
    var half = side==='L' ? halfL : halfR;
    var isR = side==='R';
    if(p.done || p.idx >= p.order.length){
      p.done = true;
      half.innerHTML = '<div class="done-hint"><div class="big">已答完，等待…</div></div>';
      return;
    }
    var item = BANK[p.order[p.idx]];
    var meta = '<div class="q-meta">'+
        '<span class="q-type '+(item.type==='choice'?'choice':'judge')+(isR?' r':'')+'">'+(item.type==='choice'?'单选题':'判断题')+'</span>'+
        '<span class="q-no">第 '+(p.idx+1)+' 题</span>'+
      '</div>';
    var qhtml = '<div class="q-text">'+item.q+'</div>';

    var optHtml = '';
    if(item.type==='choice'){
      var labels=['A','B','C','D'];
      optHtml = '<div class="options">';
      item.options.forEach(function(o,i){
        optHtml += '<div class="opt" data-i="'+i+'"><span class="tag">'+labels[i]+'</span><span>'+o+'</span></div>';
      });
      optHtml += '</div>';
    }else{
      optHtml = '<div class="options">'+
        '<div class="opt judge-btn" data-i="1"><span class="tag">✓</span><span>正确</span></div>'+
        '<div class="opt judge-btn" data-i="0"><span class="tag">✗</span><span>错误</span></div>'+
      '</div>';
    }
    var skipHtml = '<div class="skip-row"><button class="skip-btn">不会 · 跳过</button></div>';

    half.innerHTML = meta + qhtml + optHtml + skipHtml + '<div class="feedback hidden"></div>';

    // 绑定选项
    var opts = half.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function(opt){
      opt.addEventListener('click', function(){
        answer(side, parseInt(opt.getAttribute('data-i'),10));
      });
    });
    half.querySelector('.skip-btn').addEventListener('click', function(){
      doSkip(side);
    });
  }

  /* ================= 答题 ================= */
  function answer(side, choice){
    var p = players[side];
    var half = side==='L'?halfL:halfR;
    if(!playing || p.locked || p.done) return;
    p.locked = true;
    var item = BANK[p.order[p.idx]];
    var correct = (item.type==='choice') ? (choice===item.answer) : (choice===1 ? item.answer===true : item.answer===false);

    var opts = half.querySelectorAll('.opt');
    var fb = half.querySelector('.feedback');
    var skipBtn = half.querySelector('.skip-btn');
    if(skipBtn){ skipBtn.style.display='none'; }

    // 高亮
    if(item.type==='choice'){
      opts.forEach(function(opt){
        var i = parseInt(opt.getAttribute('data-i'),10);
        opt.classList.remove('dim');
        if(i===item.answer){ opt.classList.add('reveal-correct'); }
        else if(i===choice){ opt.classList.add('wrong'); }
        else{ opt.classList.add('dim'); }
      });
    }else{
      // judge: data-i=1 -> 正确, 0 -> 错误
      opts.forEach(function(opt){
        var i = parseInt(opt.getAttribute('data-i'),10);
        var optTruth = (i===1);
        if(optTruth===item.answer){ opt.classList.add('reveal-correct'); }
        else if(i===choice){ opt.classList.add('wrong'); }
        else{ opt.classList.add('dim'); }
      });
    }

    if(correct){
      p.correct++; p.score += 10;
      fb.className = 'feedback ok';
      fb.innerHTML = '✓ 回答正确！' + '　<span style="font-weight:400">'+item.explain+'</span>';
      fb.classList.remove('hidden');
      sCorrect();
    }else{
      p.wrong++;
      var rightText = (item.type==='choice') ? ('正确答案：'+['A','B','C','D'][item.answer]) : ('正确答案：'+(item.answer?'正确':'错误'));
      fb.className = 'feedback bad';
      fb.innerHTML = '✗ 回答错误　'+rightText+'　<span style="font-weight:400">'+item.explain+'</span>';
      fb.classList.remove('hidden');
      sWrong();
    }
    updateTop();

    setTimeout(function(){
      p.locked = false;
      p.idx++;
      renderQuestion(side);
      // 双方都答完 → 提前结算
      if(players.L.done && players.R.done){ finish(); }
    }, correct ? 1100 : 1800);
  }

  function doSkip(side){
    var p = players[side];
    var half = side==='L'?halfL:halfR;
    if(!playing || p.locked || p.done) return;
    p.locked = true;
    p.skip++;
    var fb = half.querySelector('.feedback');
    fb.className = 'feedback skip';
    var item = BANK[p.order[p.idx]];
    var rightText = (item.type==='choice') ? ('答案：'+['A','B','C','D'][item.answer]) : ('答案：'+(item.answer?'正确':'错误'));
    fb.innerHTML = '已跳过　'+rightText+'　<span style="font-weight:400">'+item.explain+'</span>';
    fb.classList.remove('hidden');
    var skipBtn = half.querySelector('.skip-btn'); if(skipBtn){ skipBtn.style.display='none'; }
    sSkip();
    updateTop();
    setTimeout(function(){
      p.locked=false; p.idx++; renderQuestion(side);
      if(players.L.done && players.R.done){ finish(); }
    }, 1600);
  }

  /* ================= 结算 ================= */
  function finish(){
    if(!playing && remain>0 && !players.L.done && !players.R.done) return;
    playing = false;
    if(timerId){ clearInterval(timerId); timerId=null; }
    sEnd();
    var L=players.L, R=players.R;
    var lWin = L.score>R.score;
    var rWin = R.score>L.score;
    var title = $('resTitle');
    if(lWin){ title.textContent = L.name+' 获胜'; title.className='result-title blue'; }
    else if(rWin){ title.textContent = R.name+' 获胜'; title.className='result-title red'; }
    else{ title.textContent = '平局'; title.className='result-title tie'; }

    $('resNameL').textContent = L.name;
    $('resNameR').textContent = R.name;
    $('resScoreL').textContent = L.score;
    $('resScoreR').textContent = R.score;
    $('resStatL').textContent = '答对 '+L.correct+' / 答错 '+L.wrong+(L.skip?' / 跳过 '+L.skip:'');
    $('resStatR').textContent = '答对 '+R.correct+' / 答错 '+R.wrong+(R.skip?' / 跳过 '+R.skip:'');

    var cL=$('resCardL'), cR=$('resCardR');
    cL.classList.remove('winner','red'); cR.classList.remove('winner','red');
    $('crownL').textContent=''; $('crownR').textContent='';
    if(lWin){ cL.classList.add('winner'); $('crownL').textContent='👑'; }
    else if(rWin){ cR.classList.add('winner'); cR.classList.add('red'); $('crownR').textContent='👑'; }

    elGame.classList.add('hidden');
    elResult.classList.remove('hidden');
  }

  /* ================= 事件 ================= */
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', function(){ startGame(); });
  $('backBtn').addEventListener('click', function(){
    if(timerId){ clearInterval(timerId); timerId=null; }
    playing=false;
    elResult.classList.add('hidden');
    elGame.classList.add('hidden');
    elSetup.classList.remove('hidden');
  });

})();
</script>
</body>
</html>
